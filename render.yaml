services:
  - type: web
    name: edtemps-api
    env: node
    plan: free
    buildCommand: npm install && npm run build:api
    startCommand: npx tsx apps/api/src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: edtemps-db
          property: connectionString

databases:
  - name: edtemps-db
    plan: free
    databaseName: edtemps
    user: edtemps_user
